name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.Substring(1) }
          else { $v = "dev-" + $env:GITHUB_SHA.Substring(0, 7) }
          "value=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Compile WinDock.exe
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.value }}"
          # the version shown in WinDock's menu = release version
          (Get-Content WinDock.cs -Raw -Encoding UTF8) -replace 'public const string Version = "[^"]*"', ('public const string Version = "' + $v + '"') |
            Set-Content WinDock.cs -Encoding UTF8 -NoNewline
          $fw = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319"
          $wm = "$env:WINDIR\System32\WinMetadata"
          $base = @('/nologo', '/codepage:65001', '/target:winexe', '/optimize+', '/out:WinDock.exe', "/lib:$fw\WPF",
                    '/r:PresentationFramework.dll', '/r:PresentationCore.dll', '/r:WindowsBase.dll', '/r:System.Xaml.dll',
                    '/r:System.Web.Extensions.dll', '/r:System.Windows.Forms.dll', '/r:System.Drawing.dll', '/r:System.Core.dll',
                    '/win32icon:windock.ico')
          $wrt = @('/define:WINRT', "/r:$wm\Windows.Foundation.winmd", "/r:$wm\Windows.Media.winmd", "/r:$wm\Windows.Storage.winmd")
          foreach ($f in 'System.Runtime.dll', 'System.Runtime.InteropServices.WindowsRuntime.dll', 'System.Threading.Tasks.dll', 'System.IO.dll') {
            if (Test-Path "$fw\$f") { $wrt += "/r:$fw\$f" }
          }
          & "$fw\csc.exe" @base @wrt WinDock.cs
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Full variant failed, building the basic variant (no cover art)"
            & "$fw\csc.exe" @base WinDock.cs
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Compile WinDockSetup.exe
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.value }}"
          @"
          namespace WinDockSetup { static class SetupVersion { public const string Value = "$v"; } }
          "@ | Set-Content installer\SetupVersion.cs -Encoding UTF8
          $fw = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319"
          & "$fw\csc.exe" /nologo /codepage:65001 /target:winexe /optimize+ /out:WinDockSetup.exe /win32icon:windock.ico `
            /win32manifest:installer\setup.manifest /resource:WinDock.exe,WinDock.exe `
            /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Web.Extensions.dll `
            installer\Setup.cs installer\SetupVersion.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: WinDock-${{ steps.ver.outputs.value }}
          path: |
            WinDockSetup.exe
            WinDock.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: WinDock ${{ steps.ver.outputs.value }}
          generate_release_notes: true
          body: |
            **WinDockSetup.exe** – installs WinDock for your user (no admin rights), adds a Start menu shortcut and optionally starts it with Windows.
            **WinDock.exe** – portable, just put it in a folder and run it.

            Windows SmartScreen may warn because the files are unsigned: *More info → Run anyway*.
          files: |
            WinDockSetup.exe
            WinDock.exe
